# Every push: run every grader on every design, rebuild the report and figures, and fail if any committed verdict,
# log or figure is not reproduced exactly; then exercise the reward environment. A v* tag publishes the results.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    timeout-minutes: 90
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: bash scripts/install-tools.sh
      - name: Grade every design with every grader
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make bench
      - name: Report and figures
        run: make report
      - name: Verdicts, logs and figures are reproduced
        run: make check
      - name: Reward environment
        run: make demo
      - name: Summary
        if: always()
        run: sed -n '/## Reward errors/,/## Bugs each/p' results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results and figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: |
            results/
            figures/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bench
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: results
          path: results
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "rtl-reward-bench-${GITHUB_REF_NAME}-results.tar.gz" results
          gh release create "$GITHUB_REF_NAME" *.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Every grader rerun on the pinned toolchain; verdicts, report and figures attached."
